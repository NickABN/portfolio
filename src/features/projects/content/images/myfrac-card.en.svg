<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">MYFRAC, card cover</title>
  <desc id="d">Gate devices (facial terminals and QR scanners) call a Spring Boot API over HMAC-signed HTTPS, and the API keeps residents and the visit log in MySQL. A WhatsApp chatbot sends temporary QR codes to the scanners through AWS IoT Core over MQTT, about 7,000 accesses a month.</desc>
  <defs>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:3}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:4}
      .rule{stroke:#07393C;stroke-width:2}
      .flow{stroke:#9E5536;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#DCDFDE"/>
  <text x="60" y="76" class="sans" font-size="28" fill="#9E5536">MYFRAC · Architecture</text>
  <text x="60" y="176" class="serif" font-size="80">One core, the gate</text>
  <text x="60" y="264" class="serif" font-size="80">and everyone around it</text>
  <line x1="60" y1="292" x2="1540" y2="292" class="rule"/>
  <rect x="60" y="350" width="400" height="240" class="box"/>
  <text x="84" y="426" class="serif" font-size="46">Gate devices</text>
  <text x="84" y="484" class="mono" font-size="28">facial terminals,</text>
  <text x="84" y="526" class="mono" font-size="28">QR scanners</text>
  <path d="M466 470 H 588" class="flow" marker-end="url(#acc)"/>
  <rect x="600" y="350" width="400" height="240" class="hot"/>
  <text x="624" y="426" class="serif" font-size="46">Spring Boot API</text>
  <text x="624" y="484" class="mono" font-size="28">HMAC-signed</text>
  <text x="624" y="526" class="mono" font-size="28">HTTPS</text>
  <path d="M1006 470 H 1128" class="flow" marker-end="url(#acc)"/>
  <rect x="1140" y="350" width="400" height="240" class="box"/>
  <text x="1164" y="426" class="serif" font-size="46">MySQL</text>
  <text x="1164" y="484" class="mono" font-size="28">residents,</text>
  <text x="1164" y="526" class="mono" font-size="28">visit log</text>
  <rect x="60" y="650" width="400" height="240" class="box"/>
  <text x="84" y="726" class="serif" font-size="46">Chatbot</text>
  <text x="84" y="784" class="mono" font-size="28">WhatsApp · Botmaker,</text>
  <text x="84" y="826" class="mono" font-size="28">FastAPI</text>
  <path d="M466 770 H 588" class="flow" marker-end="url(#acc)"/>
  <rect x="600" y="650" width="400" height="240" class="hot"/>
  <text x="624" y="726" class="serif" font-size="46">AWS IoT Core</text>
  <text x="624" y="784" class="mono" font-size="28">MQTT,</text>
  <text x="624" y="826" class="mono" font-size="28">temporary QR codes</text>
  <path d="M680 650 V 620 H 260 V 598" class="flow" marker-end="url(#acc)"/>
  <rect x="1140" y="650" width="400" height="240" class="hot"/>
  <text x="1164" y="750" class="serif" font-size="76">~7,000</text>
  <text x="1164" y="806" class="mono" font-size="28">accesses a month,</text>
  <text x="1164" y="846" class="mono" font-size="28">via WhatsApp</text>
</svg>
