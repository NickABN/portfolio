<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">MYFRAC facial access</title>
  <desc id="d">Administrators upload resident photos, one at a time or as a ZIP, to a Spring Boot API that keeps up to two active photos per resident in S3 and MySQL. Facial terminals at the gate pull the active list over HTTPS with HMAC signatures and match faces locally. Each check-in or check-out is posted back to the API, verified and stored as a visit log in MySQL, where administrators filter and export it. Temporary visitor QR codes travel separately: a chatbot calls a Lambda service that publishes them over MQTT through AWS IoT Core to the QR scanners.</desc>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#07393C"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:1.5}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:2}
      .rule{stroke:#07393C;stroke-width:1}
      .flow{stroke:#9E5536;stroke-width:2;fill:none}
      .link{stroke:#07393C;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect width="1680" height="720" fill="#DCDFDE"/>

  <!-- Header -->
  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">MYFRAC · Facial access</text>
  <text x="56" y="108" class="serif" font-size="38">From an uploaded photo to a gate decision</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>

  <text x="56" y="164" class="sans" font-size="12" fill="#685762">01 — Enrolment and sync</text>
  <rect x="56" y="176" width="308" height="88" class="hot"/>
  <text x="76" y="210" class="serif" font-size="24">Web panel</text>
  <text x="76" y="234" class="mono" font-size="14">One photo per resident</text>
  <text x="76" y="254" class="mono" font-size="14">or a bulk ZIP, live progress</text>
  <rect x="476" y="176" width="308" height="88" class="hot"/>
  <text x="496" y="210" class="serif" font-size="24">Spring Boot API</text>
  <text x="496" y="234" class="mono" font-size="14">Up to 2 photos per resident</text>
  <text x="496" y="254" class="mono" font-size="14">the oldest is superseded</text>
  <rect x="896" y="176" width="308" height="88" class="hot"/>
  <text x="916" y="210" class="serif" font-size="24">S3 · MySQL</text>
  <text x="916" y="234" class="mono" font-size="14">Photo file in S3</text>
  <text x="916" y="254" class="mono" font-size="14">State and slot in MySQL</text>
  <rect x="1316" y="176" width="308" height="88" class="hot"/>
  <text x="1336" y="210" class="serif" font-size="24">Facial terminal</text>
  <text x="1336" y="234" class="mono" font-size="14">Pulls the active list</text>
  <text x="1336" y="254" class="mono" font-size="14">Matches faces locally</text>
  <path d="M364 220 H 472" class="flow" marker-end="url(#acc)"/>
  <text x="372" y="210" class="mono" font-size="13">upload</text>
  <path d="M784 220 H 892" class="flow" marker-end="url(#acc)"/>
  <text x="792" y="210" class="mono" font-size="13">saves</text>
  <path d="M1204 220 H 1312" class="flow" marker-end="url(#acc)"/>
  <text x="1212" y="210" class="mono" font-size="13">list</text>
  <text x="1212" y="242" class="mono" font-size="13">HTTPS · HMAC</text>
  <text x="56" y="296" class="sans" font-size="12" fill="#685762">02 — The gate</text>
  <text x="330" y="296" class="mono" font-size="13">faces over HTTPS · QR codes over MQTT</text>
  <rect x="56" y="308" width="308" height="88" class="hot"/>
  <text x="76" y="342" class="serif" font-size="24">Facial terminal</text>
  <text x="76" y="366" class="mono" font-size="14">Matches on the device</text>
  <text x="76" y="386" class="mono" font-size="14">sends the decision</text>
  <rect x="476" y="308" width="308" height="88" class="hot"/>
  <text x="496" y="342" class="serif" font-size="24">Spring Boot API</text>
  <text x="496" y="366" class="mono" font-size="14">Checks the signature,</text>
  <text x="496" y="386" class="mono" font-size="14">device status, one-time nonce</text>
  <rect x="896" y="308" width="308" height="88" class="hot"/>
  <text x="916" y="342" class="serif" font-size="24">MySQL visit log</text>
  <text x="916" y="366" class="mono" font-size="14">One record per event</text>
  <text x="916" y="386" class="mono" font-size="14">face · QR · tag · manual</text>
  <path d="M364 352 H 472" class="flow" marker-end="url(#acc)"/>
  <text x="372" y="342" class="mono" font-size="13">in / out</text>
  <text x="372" y="374" class="mono" font-size="13">signed</text>
  <path d="M784 352 H 892" class="flow" marker-end="url(#acc)"/>
  <text x="1316" y="342" class="mono" font-size="14">Each record keeps match</text>
  <text x="1316" y="364" class="mono" font-size="14">confidence, decision,</text>
  <text x="1316" y="386" class="mono" font-size="14">deny reason and gate</text>
  <rect x="56" y="416" width="308" height="80" class="box"/>
  <text x="76" y="448" class="serif" font-size="24">Chatbot</text>
  <text x="76" y="470" class="mono" font-size="14">Temporary visitor QR</text>
  <rect x="476" y="416" width="308" height="80" class="box"/>
  <text x="496" y="448" class="serif" font-size="24">Lambda service</text>
  <text x="496" y="470" class="mono" font-size="14">Publishes to the</text>
  <text x="496" y="488" class="mono" font-size="14">community topic</text>
  <rect x="896" y="416" width="308" height="80" class="box"/>
  <text x="916" y="448" class="serif" font-size="24">AWS IoT Core</text>
  <text x="916" y="470" class="mono" font-size="14">MQTT broker</text>
  <rect x="1316" y="416" width="308" height="80" class="box"/>
  <text x="1336" y="448" class="serif" font-size="24">QR scanner</text>
  <text x="1336" y="470" class="mono" font-size="14">Receives the code</text>
  <text x="1336" y="488" class="mono" font-size="14">and returns an ACK</text>
  <path d="M364 456 H 472" class="link" marker-end="url(#ink)"/>
  <text x="372" y="446" class="mono" font-size="13">HTTPS</text>
  <path d="M784 456 H 892" class="link" marker-end="url(#ink)"/>
  <text x="792" y="446" class="mono" font-size="13">MQTT</text>
  <path d="M1204 456 H 1312" class="link" marker-end="url(#ink)"/>
  <text x="1212" y="446" class="mono" font-size="13">MQTT</text>
  <text x="56" y="526" class="sans" font-size="12" fill="#685762">03 — What admins see</text>
  <rect x="56" y="538" width="308" height="88" class="box"/>
  <text x="76" y="572" class="serif" font-size="24">Visit log</text>
  <text x="76" y="596" class="mono" font-size="14">MySQL</text>
  <text x="76" y="616" class="mono" font-size="14">Every gate event</text>
  <rect x="476" y="538" width="308" height="88" class="box"/>
  <text x="496" y="572" class="serif" font-size="24">Spring Boot API</text>
  <text x="496" y="596" class="mono" font-size="14">Filter by text, in/out,</text>
  <text x="496" y="616" class="mono" font-size="14">gate and date range</text>
  <rect x="896" y="538" width="308" height="88" class="box"/>
  <text x="916" y="572" class="serif" font-size="24">Admin panel</text>
  <text x="916" y="596" class="mono" font-size="14">Facial visits report</text>
  <text x="916" y="616" class="mono" font-size="14">Export to Excel or CSV</text>
  <path d="M364 582 H 472" class="link" marker-end="url(#ink)"/>
  <path d="M784 582 H 892" class="link" marker-end="url(#ink)"/>
  <text x="1316" y="572" class="mono" font-size="14">Facial access is a</text>
  <text x="1316" y="594" class="mono" font-size="14">per-community feature</text>
  <text x="1316" y="616" class="mono" font-size="14">flag</text>
  <!-- Footer band -->
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="682" class="sans" font-size="12" fill="#07393C">Device trust — HMAC</text>
  <text x="430" y="682" class="mono" font-size="14">device ID · timestamp · one-time nonce · body hash on every call</text>
</svg>
