<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">Legacy database migration flow</title>
  <desc id="d">A Python ETL reads the legacy Firebird club database without writing to it, loads untransformed rows into a raw staging schema in PostgreSQL with a hash per row, transforms and maps them in a dry run first, and only then writes to the new schema. Count validation, idempotent reruns and a run ledger with rollback guard each stage.</desc>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#07393C"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:1.5}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:2}
      .rule{stroke:#07393C;stroke-width:1}
      .flow{stroke:#9E5536;stroke-width:2;fill:none}
      .link{stroke:#07393C;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect width="1680" height="720" fill="#DCDFDE"/>

  <!-- Header -->
  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">Club Management System · Legacy migration</text>
  <text x="56" y="108" class="serif" font-size="38">From the legacy database to the new schema, safely</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>

  <!-- Lane labels -->
  <text x="56" y="178" class="sans" font-size="12" fill="#685762">01 — The data path</text>
  <text x="56" y="394" class="sans" font-size="12" fill="#685762">02 — What keeps it safe</text>

  <!-- Lane 1 -->
  <rect x="56" y="196" width="320" height="148" class="box"/>
  <text x="76" y="232" class="serif" font-size="24">Legacy club DB</text>
  <text x="76" y="260" class="mono" font-size="14">Firebird · read-only access</text>
  <text x="76" y="282" class="mono" font-size="14">members · spa · courts</text>
  <text x="76" y="304" class="mono" font-size="14">billing movements</text>

  <path d="M376 270 H 468" class="flow" marker-end="url(#acc)"/>
  <text x="384" y="258" class="mono" font-size="13">load-raw</text>

  <rect x="472" y="196" width="320" height="148" class="hot"/>
  <text x="492" y="232" class="serif" font-size="24">Raw staging</text>
  <text x="492" y="260" class="mono" font-size="14">untransformed rows as JSONB</text>
  <text x="492" y="282" class="mono" font-size="14">one SHA-256 hash per row</text>
  <text x="492" y="304" class="mono" font-size="14">blobs kept as digests</text>

  <path d="M792 270 H 884" class="flow" marker-end="url(#acc)"/>
  <text x="800" y="258" class="mono" font-size="13">canonical</text>
  <text x="800" y="294" class="mono" font-size="13">--dry-run</text>

  <rect x="888" y="196" width="320" height="148" class="hot"/>
  <text x="908" y="232" class="serif" font-size="24">Transform &amp; map</text>
  <text x="908" y="260" class="mono" font-size="14">status codes to states</text>
  <text x="908" y="282" class="mono" font-size="14">family codes to relations</text>
  <text x="908" y="304" class="mono" font-size="14">placeholder values nulled</text>
  <text x="908" y="326" class="mono" font-size="14">deterministic person IDs</text>

  <path d="M1208 270 H 1300" class="flow" marker-end="url(#acc)"/>
  <text x="1216" y="258" class="mono" font-size="13">canonical</text>
  <text x="1216" y="294" class="mono" font-size="13">--write</text>

  <rect x="1304" y="196" width="320" height="148" class="box"/>
  <text x="1324" y="232" class="serif" font-size="24">PostgreSQL schema</text>
  <text x="1324" y="260" class="mono" font-size="14">persons · memberships</text>
  <text x="1324" y="282" class="mono" font-size="14">resources · availability</text>
  <text x="1324" y="304" class="mono" font-size="14">member charges ledger</text>

  <!-- Connectors -->
  <path d="M316 344 V 410" class="link" marker-end="url(#ink)"/>
  <path d="M732 344 V 410" class="link" marker-end="url(#ink)"/>
  <path d="M1148 344 V 410" class="link" marker-end="url(#ink)"/>
  <path d="M1564 344 V 410" class="link" marker-end="url(#ink)"/>

  <!-- Lane 2 -->
  <rect x="56" y="414" width="320" height="150" class="box"/>
  <text x="76" y="450" class="serif" font-size="24">Validate</text>
  <text x="76" y="478" class="mono" font-size="14">legacy vs staged row counts</text>
  <text x="76" y="500" class="mono" font-size="14">primary-key parity</text>
  <text x="76" y="522" class="mono" font-size="14">blocks on unmapped codes</text>
  <text x="76" y="544" class="mono" font-size="14">non-zero exit on mismatch</text>

  <rect x="472" y="414" width="320" height="150" class="box"/>
  <text x="492" y="450" class="serif" font-size="24">Idempotent reruns</text>
  <text x="492" y="478" class="mono" font-size="14">unique on table, key, hash</text>
  <text x="492" y="500" class="mono" font-size="14">unchanged rows are no-ops</text>
  <text x="492" y="522" class="mono" font-size="14">changed rows kept as history</text>
  <text x="492" y="544" class="mono" font-size="14">one transaction per table</text>

  <rect x="888" y="414" width="320" height="150" class="box"/>
  <text x="908" y="450" class="serif" font-size="24">Dry run first</text>
  <text x="908" y="478" class="mono" font-size="14">summary by default</text>
  <text x="908" y="500" class="mono" font-size="14">writes only with --write</text>
  <text x="908" y="522" class="mono" font-size="14">operator sign-off on mapping</text>
  <text x="908" y="544" class="mono" font-size="14">unmapped codes rejected</text>

  <rect x="1304" y="414" width="320" height="150" class="box"/>
  <text x="1324" y="450" class="serif" font-size="24">Run ledger &amp; rollback</text>
  <text x="1324" y="478" class="mono" font-size="14">every insert tagged by run ID</text>
  <text x="1324" y="500" class="mono" font-size="14">deterministic run IDs</text>
  <text x="1324" y="522" class="mono" font-size="14">rollback removes only that run</text>
  <text x="1324" y="544" class="mono" font-size="14">the source is never written</text>

  <!-- Footer band -->
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="682" class="sans" font-size="12" fill="#07393C">Read-only by design</text>
  <text x="430" y="682" class="mono" font-size="14">Python · Docker Compose · the legacy database is only ever read</text>
</svg>
