<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Oasis, portada de tarjeta</title>
  <desc id="d">Clientes Flutter y React llaman a una API REST en Node y Express sobre Elastic Beanstalk, que guarda reservas y pagos de Stripe en MySQL en una sola transacción. La API verifica cada cobro de Stripe. La web pasó de 25 a 150 usuarios concurrentes en la misma instancia.</desc>
  <defs>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:3}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:4}
      .rule{stroke:#07393C;stroke-width:2}
      .flow{stroke:#9E5536;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#DCDFDE"/>
  <text x="60" y="76" class="sans" font-size="28" fill="#9E5536">Oasis · Arquitectura</text>
  <text x="60" y="176" class="serif" font-size="80">Del toque de un huésped</text>
  <text x="60" y="264" class="serif" font-size="80">a un palco confirmado</text>
  <line x1="60" y1="292" x2="1540" y2="292" class="rule"/>
  <rect x="60" y="350" width="400" height="240" class="box"/>
  <text x="84" y="426" class="serif" font-size="46">Huéspedes</text>
  <text x="84" y="484" class="mono" font-size="28">Flutter · React</text>
  <text x="84" y="526" class="mono" font-size="28">iOS · Android · web</text>
  <path d="M466 470 H 588" class="flow" marker-end="url(#acc)"/>
  <rect x="600" y="350" width="400" height="240" class="hot"/>
  <text x="624" y="426" class="serif" font-size="46">API REST</text>
  <text x="624" y="484" class="mono" font-size="28">Node · Express</text>
  <text x="624" y="526" class="mono" font-size="28">Elastic Beanstalk</text>
  <path d="M1006 470 H 1128" class="flow" marker-end="url(#acc)"/>
  <rect x="1140" y="350" width="400" height="240" class="box"/>
  <text x="1164" y="426" class="serif" font-size="46">MySQL</text>
  <text x="1164" y="484" class="mono" font-size="28">reservas y pagos,</text>
  <text x="1164" y="526" class="mono" font-size="28">una transacción</text>
  <rect x="600" y="650" width="400" height="240" class="box"/>
  <text x="624" y="726" class="serif" font-size="46">Stripe</text>
  <text x="624" y="784" class="mono" font-size="28">cobro verificado</text>
  <text x="624" y="826" class="mono" font-size="28">por la API</text>
  <path d="M800 650 V 598" class="flow" marker-end="url(#acc)"/>
  <rect x="1140" y="650" width="400" height="240" class="hot"/>
  <text x="1164" y="750" class="serif" font-size="76">25 → 150</text>
  <text x="1164" y="806" class="mono" font-size="28">usuarios web,</text>
  <text x="1164" y="846" class="mono" font-size="28">en la misma instancia</text>
</svg>
