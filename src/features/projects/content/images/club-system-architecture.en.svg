<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">Club Management System architecture</title>
  <desc id="d">Staff and operators use a React single-page app served from S3 and CloudFront. It calls a FastAPI back end that enforces roles and permissions over a PostgreSQL database on Amazon RDS. An OpenAPI contract drives both sides, Goose migrations shape the schema, Terraform and CI/CD pipelines deliver everything on AWS, and a Python ETL loads data from the legacy club database.</desc>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#07393C"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:1.5}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:2}
      .rule{stroke:#07393C;stroke-width:1}
      .flow{stroke:#9E5536;stroke-width:2;fill:none}
      .link{stroke:#07393C;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect width="1680" height="720" fill="#DCDFDE"/>

  <!-- Header -->
  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">Club Management System · Architecture</text>
  <text x="56" y="108" class="serif" font-size="38">From the browser to the database, by contract</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>

  <!-- Lane labels -->
  <text x="56" y="178" class="sans" font-size="12" fill="#685762">01 — The platform</text>
  <text x="56" y="364" class="sans" font-size="12" fill="#685762">02 — Contract, schema and delivery</text>
  <text x="56" y="504" class="sans" font-size="12" fill="#685762">03 — Legacy migration</text>

  <!-- Lane 1: request path -->
  <rect x="56" y="196" width="280" height="112" class="box"/>
  <text x="76" y="228" class="serif" font-size="24">Staff &amp; operators</text>
  <text x="76" y="256" class="mono" font-size="14">Superadmin · admin</text>
  <text x="76" y="276" class="mono" font-size="14">Supervisor · operator</text>
  <text x="76" y="296" class="mono" font-size="14">Staff roles</text>

  <path d="M336 252 H 452" class="flow" marker-end="url(#acc)"/>
  <text x="352" y="240" class="mono" font-size="13">browser</text>

  <rect x="456" y="196" width="320" height="112" class="hot"/>
  <text x="476" y="236" class="serif" font-size="24">React SPA</text>
  <text x="476" y="264" class="mono" font-size="14">Vite · TypeScript</text>
  <text x="476" y="286" class="mono" font-size="14">S3 + CloudFront</text>

  <path d="M776 252 H 892" class="flow" marker-end="url(#acc)"/>
  <text x="812" y="240" class="mono" font-size="13">REST</text>
  <text x="812" y="276" class="mono" font-size="13">JWT</text>

  <rect x="896" y="196" width="320" height="112" class="hot"/>
  <text x="916" y="236" class="serif" font-size="24">FastAPI</text>
  <text x="916" y="264" class="mono" font-size="14">Python · Docker on ECS</text>
  <text x="916" y="286" class="mono" font-size="14">roles &amp; permissions</text>

  <path d="M1216 252 H 1332" class="flow" marker-end="url(#acc)"/>
  <text x="1232" y="240" class="mono" font-size="13">SQL</text>

  <rect x="1336" y="196" width="288" height="112" class="box"/>
  <text x="1356" y="236" class="serif" font-size="24">PostgreSQL</text>
  <text x="1356" y="264" class="mono" font-size="14">Amazon RDS</text>
  <text x="1356" y="286" class="mono" font-size="14">members · reservations</text>

  <!-- Lane 2 -->
  <rect x="56" y="380" width="424" height="80" class="box"/>
  <text x="76" y="412" class="serif" font-size="24">Terraform on AWS</text>
  <text x="76" y="434" class="mono" font-size="14">infra reviewed like code,</text>
  <text x="76" y="452" class="mono" font-size="14">by the client's infra team</text>

  <rect x="560" y="380" width="440" height="80" class="box"/>
  <text x="580" y="412" class="serif" font-size="24">OpenAPI contract</text>
  <text x="580" y="438" class="mono" font-size="14">written before the endpoint or the screen</text>

  <path d="M740 380 V 312" class="link" marker-end="url(#ink)"/>
  <path d="M960 380 V 312" class="link" marker-end="url(#ink)"/>

  <rect x="1040" y="380" width="260" height="80" class="box"/>
  <text x="1060" y="412" class="serif" font-size="24">CI/CD pipelines</text>
  <text x="1060" y="434" class="mono" font-size="14">CodePipeline</text>
  <text x="1060" y="452" class="mono" font-size="14">CodeBuild · Docker</text>

  <rect x="1380" y="380" width="244" height="80" class="box"/>
  <text x="1400" y="412" class="serif" font-size="24">Goose migrations</text>
  <text x="1400" y="438" class="mono" font-size="14">db-ops task on ECS</text>
  <path d="M1500 380 V 312" class="link" marker-end="url(#ink)"/>

  <!-- Lane 3: legacy migration -->
  <rect x="56" y="520" width="280" height="80" class="box"/>
  <text x="76" y="552" class="serif" font-size="24">Legacy club DB</text>
  <text x="76" y="578" class="mono" font-size="14">Firebird · read-only</text>

  <path d="M336 560 H 452" class="flow" marker-end="url(#acc)"/>
  <text x="356" y="548" class="mono" font-size="13">extract</text>

  <rect x="456" y="520" width="320" height="80" class="hot"/>
  <text x="476" y="552" class="serif" font-size="24">Python ETL</text>
  <text x="476" y="578" class="mono" font-size="14">stage · map · validate · load</text>

  <path d="M776 560 H 1360 V 312" class="flow" marker-end="url(#acc)"/>
  <text x="800" y="548" class="mono" font-size="13">canonical schema, rerunnable</text>

  <!-- Footer band -->
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="682" class="sans" font-size="12" fill="#07393C">Infrastructure as code — Terraform</text>
  <text x="430" y="682" class="mono" font-size="14">VPC · ALB · ECS Fargate · RDS · CloudFront · S3 · Route 53 · CodePipeline</text>
</svg>
