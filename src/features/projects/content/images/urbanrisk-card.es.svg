<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">UrbanRisk Analytics, portada de tarjeta</title>
  <desc id="d">Mapa de calor simplificado del riesgo predicho por alcaldía y franja horaria en la Ciudad de México: Iztapalapa, Cuauhtémoc y Gustavo A. Madero son las más oscuras por la tarde y la noche, Milpa Alta se mantiene clara todo el día y todas las alcaldías están más tranquilas de madrugada.</desc>
  <defs>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
