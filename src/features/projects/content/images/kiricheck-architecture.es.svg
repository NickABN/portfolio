<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de Kiricheck</title>
  <desc id="d">Los empleados registran su asistencia por WhatsApp en un servicio de check-in sobre Lambda que guarda la asistencia en DynamoDB. Los administradores usan un front end en Nuxt servido desde S3 y CloudFront, que llama a una API de administración en FastAPI sobre Lambda. La API lee y escribe en DynamoDB, ejecuta los servicios de bonos, prenómina y monitor de incidencias, genera reportes en Excel, CSV y PDF, y avisa al front end de los cambios por WebSocket.</desc>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#07393C"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:1.5}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:2}
      .rule{stroke:#07393C;stroke-width:1}
      .flow{stroke:#9E5536;stroke-width:2;fill:none}
      .link{stroke:#07393C;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect width="1680" height="720" fill="#DCDFDE"/>

  <!-- Header -->
  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">Kiricheck · Arquitectura</text>
  <text x="56" y="108" class="serif" font-size="38">De un mensaje de WhatsApp a la nómina</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>

  <!-- Lane labels -->
  <text x="56" y="178" class="sans" font-size="12" fill="#685762">01 — El reloj</text>
  <text x="56" y="414" class="sans" font-size="12" fill="#685762">02 — La administración</text>

  <!-- Lane 1 -->
  <rect x="56" y="196" width="224" height="132" class="box"/>
  <text x="76" y="232" class="serif" font-size="24">Empleados</text>
  <text x="76" y="266" class="mono" font-size="14">Personal por turnos</text>
  <text x="76" y="290" class="mono" font-size="14">entra y sale</text>
  <text x="76" y="314" class="mono" font-size="14">sin hardware</text>

  <path d="M280 262 H 372" class="flow" marker-end="url(#acc)"/>
  <text x="288" y="250" class="mono" font-size="13">WhatsApp</text>

  <rect x="376" y="216" width="280" height="92" class="hot"/>
  <text x="396" y="256" class="serif" font-size="24">Servicio de check-in</text>
  <text x="396" y="284" class="mono" font-size="14">AWS Lambda · Python</text>

  <path d="M656 262 H 748" class="flow" marker-end="url(#acc)"/>

  <rect x="752" y="196" width="348" height="132" class="hot"/>
  <text x="772" y="232" class="serif" font-size="24">DynamoDB</text>
  <text x="772" y="266" class="mono" font-size="14">bitácora · colaboradores</text>
  <text x="772" y="290" class="mono" font-size="14">roles · horarios · lugares</text>
  <text x="772" y="314" class="mono" font-size="14">incidencias · bonos</text>

  <!-- Lane 2 -->
  <rect x="56" y="432" width="224" height="92" class="box"/>
  <text x="76" y="468" class="serif" font-size="24">Administradores</text>
  <text x="76" y="496" class="mono" font-size="14">Admins de empresa</text>
  <text x="76" y="514" class="mono" font-size="14">Superadmin</text>

  <path d="M280 478 H 372" class="link" marker-end="url(#ink)"/>

  <rect x="376" y="432" width="280" height="92" class="box"/>
  <text x="396" y="468" class="serif" font-size="24">Front de admin</text>
  <text x="396" y="496" class="mono" font-size="14">Nuxt 3 · Vue · Vuetify</text>
  <text x="396" y="514" class="mono" font-size="14">S3 + CloudFront</text>

  <path d="M656 478 H 748" class="link" marker-end="url(#ink)"/>
  <text x="680" y="466" class="mono" font-size="13">JWT</text>

  <rect x="752" y="432" width="260" height="92" class="box"/>
  <text x="772" y="468" class="serif" font-size="24">API de admin</text>
  <text x="772" y="496" class="mono" font-size="14">FastAPI · Mangum</text>
  <text x="772" y="514" class="mono" font-size="14">AWS Lambda</text>

  <!-- API reads/writes the same store -->
  <path d="M880 432 V 332" class="link" marker-start="url(#ink)" marker-end="url(#ink)"/>
  <text x="896" y="388" class="mono" font-size="13">lee · escribe</text>

  <path d="M1012 478 H 1096" class="link" marker-end="url(#ink)"/>

  <rect x="1100" y="432" width="240" height="92" class="box"/>
  <text x="1120" y="468" class="serif" font-size="24">Lógica de negocio</text>
  <text x="1120" y="496" class="mono" font-size="14">bonos · prenómina</text>
  <text x="1120" y="514" class="mono" font-size="14">monitor de incidencias</text>

  <path d="M1220 524 V 548" class="link" marker-end="url(#ink)"/>

  <rect x="1100" y="552" width="240" height="72" class="box"/>
  <text x="1120" y="580" class="serif" font-size="22">Reportes</text>
  <text x="1120" y="602" class="mono" font-size="14">Excel · CSV · PDF</text>

  <!-- Actualización en vivo -->
  <path d="M800 524 V 588 H 660" class="link" stroke-dasharray="6 6" marker-end="url(#ink)"/>
  <text x="812" y="578" class="mono" font-size="13">en cada cambio</text>

  <rect x="376" y="552" width="280" height="72" class="box"/>
  <text x="396" y="580" class="serif" font-size="22">Actualización en vivo</text>
  <text x="396" y="602" class="mono" font-size="14">notificador WebSocket</text>

  <path d="M516 552 V 528" class="link" stroke-dasharray="6 6" marker-end="url(#ink)"/>

  <!-- Design notes column -->
  <line x1="1384" y1="196" x2="1384" y2="624" class="rule"/>
  <text x="1404" y="236" class="serif" font-size="28">Por empresa</text>
  <text x="1404" y="262" class="sans" font-size="11" fill="#685762">cada tabla se indexa</text>
  <text x="1404" y="280" class="sans" font-size="11" fill="#685762">por ID de empresa</text>
  <text x="1404" y="356" class="serif" font-size="28">Por periodo</text>
  <text x="1404" y="382" class="sans" font-size="11" fill="#685762">la asistencia se lee</text>
  <text x="1404" y="400" class="sans" font-size="11" fill="#685762">con un índice por fecha</text>
  <text x="1404" y="476" class="serif" font-size="28">Sin servidores</text>
  <text x="1404" y="502" class="sans" font-size="11" fill="#685762">los picos se absorben,</text>
  <text x="1404" y="520" class="sans" font-size="11" fill="#685762">sin servidores ociosos</text>

  <!-- Footer band -->
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="682" class="sans" font-size="12" fill="#07393C">Entrega y pruebas</text>
  <text x="430" y="682" class="mono" font-size="14">Build estático de Nuxt → S3 + CloudFront · pruebas end-to-end con Playwright en el front de administración</text>
</svg>
