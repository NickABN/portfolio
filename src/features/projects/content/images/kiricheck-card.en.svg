<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Kiricheck, card cover</title>
  <desc id="d">Employees check in over WhatsApp to a Lambda service that writes to DynamoDB. A FastAPI admin API on Lambda reads it and feeds bonuses, pre-payroll and Excel, CSV and PDF reports.</desc>
  <defs>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:3}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:4}
      .rule{stroke:#07393C;stroke-width:2}
      .flow{stroke:#9E5536;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#DCDFDE"/>
  <text x="60" y="76" class="sans" font-size="28" fill="#9E5536">Kiricheck · Architecture</text>
  <text x="60" y="176" class="serif" font-size="80">From a WhatsApp</text>
  <text x="60" y="264" class="serif" font-size="80">message to payroll</text>
  <line x1="60" y1="292" x2="1540" y2="292" class="rule"/>
  <rect x="60" y="350" width="400" height="240" class="box"/>
  <text x="84" y="426" class="serif" font-size="46">Employees</text>
  <text x="84" y="484" class="mono" font-size="28">shift workers,</text>
  <text x="84" y="526" class="mono" font-size="28">check in on WhatsApp</text>
  <path d="M466 470 H 588" class="flow" marker-end="url(#acc)"/>
  <rect x="600" y="350" width="400" height="240" class="hot"/>
  <text x="624" y="426" class="serif" font-size="46">Check-in</text>
  <text x="624" y="484" class="mono" font-size="28">AWS Lambda</text>
  <text x="624" y="526" class="mono" font-size="28">Python</text>
  <path d="M1006 470 H 1128" class="flow" marker-end="url(#acc)"/>
  <rect x="1140" y="350" width="400" height="240" class="box"/>
  <text x="1164" y="426" class="serif" font-size="46">DynamoDB</text>
  <text x="1164" y="484" class="mono" font-size="28">attendance log,</text>
  <text x="1164" y="526" class="mono" font-size="28">keyed by company</text>
  <text x="60" y="750" class="mono" font-size="28">Serverless,</text>
  <text x="60" y="790" class="mono" font-size="28">no idle servers</text>
  <rect x="600" y="650" width="400" height="240" class="hot"/>
  <text x="624" y="726" class="serif" font-size="46">Pre-payroll</text>
  <text x="624" y="784" class="mono" font-size="28">bonuses · reports</text>
  <text x="624" y="826" class="mono" font-size="28">Excel · CSV · PDF</text>
  <path d="M1134 770 H 1012" class="flow" marker-end="url(#acc)"/>
  <rect x="1140" y="650" width="400" height="240" class="box"/>
  <text x="1164" y="726" class="serif" font-size="46">Admin API</text>
  <text x="1164" y="784" class="mono" font-size="28">FastAPI · Lambda</text>
  <text x="1164" y="826" class="mono" font-size="28">incident monitor</text>
  <path d="M1340 650 V 598" class="flow" marker-end="url(#acc)"/>
</svg>
