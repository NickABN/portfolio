  <text x="1296" y="268" class="serif" font-size="64" style="fill:#9E5536">0,0101</text>
  <text x="1296" y="298" class="sans" font-size="13" fill="#07393C">diferencia entre las cinco</text>
  <text x="1296" y="332" class="mono" font-size="14">Añadir los diez retardos a la</text>
  <text x="1296" y="354" class="mono" font-size="14">estructura mueve el F1 un</text>
  <text x="1296" y="376" class="mono" font-size="14">2,1 % relativo.</text>
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="674" class="mono" font-size="14">Fuente: ablación de UrbanRisk, README y registro de decisiones D-08 · XGBoost, n_estimators=400, max_depth=6, learning_rate=0.08</text>
  <text x="56" y="696" class="mono" font-size="14">Oráculo: referencia que ningún modelo real tiene, pues necesita la media histórica exacta de cada celda · el eje está truncado a 0,58–0,68</text>
