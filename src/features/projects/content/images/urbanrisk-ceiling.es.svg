<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">F1 macro por conjunto de variables: el techo es estructural</title>
  <desc id="d">Gráfico de puntos del F1 macro de cinco configuraciones de variables con XGBoost. Las cinco quedan entre 0,6565 y 0,6666, una diferencia de 0,0101. El conjunto completo con retardos obtiene 0,6666, las variables estructurales solas 0,6576 y los retardos solos 0,6565. Un oráculo hipotético que conoce la media histórica de cada celda alcanza solo 0,5921.</desc>
