<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">Macro F1 by feature set: the ceiling is structural</title>
  <desc id="d">Dot plot of macro F1 for five XGBoost feature configurations. All five fall between 0.6565 and 0.6666, a spread of 0.0101. The full set with lags scores 0.6666, structural features alone 0.6576, lags alone 0.6565. A hypothetical oracle that knows each cell historical mean reaches only 0.5921.</desc>
  <defs><style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .rule{stroke:#07393C;stroke-width:1}
    </style>
  <linearGradient id="ramp" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#EAEAEA"/><stop offset="1" stop-color="#9E5536"/></linearGradient></defs>
  <rect width="1680" height="720" fill="#DCDFDE"/>
  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">UrbanRisk Analytics · Ablation</text>
  <text x="56" y="108" class="serif" font-size="38">Every slice of the data lands at the same score</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>
  <text x="56" y="164" class="mono" font-size="14">Macro F1 on the chronological hold-out, XGBoost with identical hyperparameters</text>
  <line x1="520.0" y1="196" x2="520.0" y2="580" stroke="#07393C" stroke-opacity=".18" stroke-width="1"/>
  <text x="520.0" y="604" text-anchor="middle" class="mono" font-size="13">0.58</text>
  <line x1="642.0" y1="196" x2="642.0" y2="580" stroke="#07393C" stroke-opacity=".18" stroke-width="1"/>
  <text x="642.0" y="604" text-anchor="middle" class="mono" font-size="13">0.60</text>
  <line x1="764.0" y1="196" x2="764.0" y2="580" stroke="#07393C" stroke-opacity=".18" stroke-width="1"/>
  <text x="764.0" y="604" text-anchor="middle" class="mono" font-size="13">0.62</text>
  <line x1="886.0" y1="196" x2="886.0" y2="580" stroke="#07393C" stroke-opacity=".18" stroke-width="1"/>
  <text x="886.0" y="604" text-anchor="middle" class="mono" font-size="13">0.64</text>
  <line x1="1008.0" y1="196" x2="1008.0" y2="580" stroke="#07393C" stroke-opacity=".18" stroke-width="1"/>
  <text x="1008.0" y="604" text-anchor="middle" class="mono" font-size="13">0.66</text>
  <line x1="1130.0" y1="196" x2="1130.0" y2="580" stroke="#07393C" stroke-opacity=".18" stroke-width="1"/>
  <text x="1130.0" y="604" text-anchor="middle" class="mono" font-size="13">0.68</text>
  <text x="825.0" y="628" text-anchor="middle" class="sans" font-size="12" fill="#685762">Macro F1</text>
  <rect x="986.6499999999996" y="196" width="61.6099999999999" height="288" fill="#9E5536" fill-opacity=".12"/>
  <text x="56" y="226" class="serif" font-size="22">Full set</text><text x="56" y="247" class="mono" font-size="13">zone + calendar + lags</text>
  <line x1="520" y1="222" x2="1130" y2="222" stroke="#07393C" stroke-opacity=".12" stroke-width="1"/><circle cx="1048.2599999999995" cy="222" r="9" fill="#9E5536" stroke="#DCDFDE" stroke-width="2"/>
  <text x="1068.2599999999995" y="227" class="mono" font-size="16" style="fill:#07393C">0.6666</text>
  <text x="56" y="288" class="serif" font-size="22">Zone + lags</text><text x="56" y="309" class="mono" font-size="13">no calendar</text>
  <line x1="520" y1="284" x2="1130" y2="284" stroke="#07393C" stroke-opacity=".12" stroke-width="1"/><circle cx="1003.1199999999999" cy="284" r="9" fill="#07393C" stroke="#DCDFDE" stroke-width="2"/>
  <text x="1023.1199999999999" y="289" class="mono" font-size="16" style="fill:#07393C">0.6592</text>
  <text x="56" y="350" class="serif" font-size="22">Calendar + lags</text><text x="56" y="371" class="mono" font-size="13">no zone</text>
  <line x1="520" y1="346" x2="1130" y2="346" stroke="#07393C" stroke-opacity=".12" stroke-width="1"/><circle cx="997.0199999999999" cy="346" r="9" fill="#07393C" stroke="#DCDFDE" stroke-width="2"/>
  <text x="1017.0199999999999" y="351" class="mono" font-size="16" style="fill:#07393C">0.6582</text>
  <text x="56" y="412" class="serif" font-size="22">Structural only</text><text x="56" y="433" class="mono" font-size="13">zone + calendar · the dashboard engine</text>
  <line x1="520" y1="408" x2="1130" y2="408" stroke="#07393C" stroke-opacity=".12" stroke-width="1"/><circle cx="993.3599999999997" cy="408" r="9" fill="#9E5536" stroke="#DCDFDE" stroke-width="2"/>
  <text x="1013.3599999999997" y="413" class="mono" font-size="16" style="fill:#07393C">0.6576</text>
  <text x="56" y="474" class="serif" font-size="22">Lags only</text><text x="56" y="495" class="mono" font-size="13">10 lag features</text>
  <line x1="520" y1="470" x2="1130" y2="470" stroke="#07393C" stroke-opacity=".12" stroke-width="1"/><circle cx="986.6499999999996" cy="470" r="9" fill="#07393C" stroke="#DCDFDE" stroke-width="2"/>
  <text x="1006.6499999999996" y="475" class="mono" font-size="16" style="fill:#07393C">0.6565</text>
  <text x="56" y="550" class="serif" font-size="22">Oracle</text><text x="56" y="571" class="mono" font-size="13">knows each cell&#x27;s exact historical mean</text>
  <line x1="520" y1="546" x2="1130" y2="546" stroke="#07393C" stroke-opacity=".12" stroke-width="1"/><circle cx="593.81" cy="546" r="9" fill="#DCDFDE" stroke="#685762" stroke-width="2.5"/>
  <text x="613.81" y="551" class="mono" font-size="16" style="fill:#07393C">0.5921</text>
  <line x1="56" y1="514" x2="1190" y2="514" stroke="#07393C" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="1260" y1="196" x2="1260" y2="560" class="rule" stroke-opacity=".3"/>
  <text x="1296" y="268" class="serif" font-size="64" style="fill:#9E5536">0.0101</text>
  <text x="1296" y="298" class="sans" font-size="13" fill="#07393C">spread across all five</text>
  <text x="1296" y="332" class="mono" font-size="14">Adding the ten lags to the</text>
  <text x="1296" y="354" class="mono" font-size="14">structural features moves F1</text>
  <text x="1296" y="376" class="mono" font-size="14">by +2.1% relative.</text>
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="674" class="mono" font-size="14">Source: UrbanRisk ablation, README and decision log D-08 · XGBoost, n_estimators=400, max_depth=6, learning_rate=0.08</text>
  <text x="56" y="696" class="mono" font-size="14">Oracle: a reference no real model has, since it needs each cell&#x27;s exact historical mean · the axis is truncated to 0.58–0.68</text>
</svg>
