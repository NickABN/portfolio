<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="t d">
  <title id="t">MYFRAC architecture</title>
  <desc id="d">Facial terminals and QR scanners at the gate call a Spring Boot API with HMAC-signed HTTPS requests. The API, which handles login with Spring Security and OAuth2, stores data in MySQL and resident photos in S3. Residents and guards use Flutter apps, administrators use a Vue panel and guards also have an Angular web app, all backed by the same API. A Python WhatsApp chatbot calls a FastAPI service on Lambda that publishes temporary visitor QR codes over MQTT through AWS IoT Core to the QR scanners.</desc>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#07393C"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9E5536"/></marker>
    <style>
      .serif{font-family:Newsreader,Georgia,'Times New Roman',serif;fill:#07393C}
      .sans{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
      .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;fill:#685762}
      .box{fill:#EAEAEA;stroke:#07393C;stroke-width:1.5}
      .hot{fill:#EAEAEA;stroke:#9E5536;stroke-width:2}
      .rule{stroke:#07393C;stroke-width:1}
      .flow{stroke:#9E5536;stroke-width:2;fill:none}
      .link{stroke:#07393C;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect width="1680" height="720" fill="#DCDFDE"/>

  <!-- Header -->
  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">MYFRAC · Architecture</text>
  <text x="56" y="108" class="serif" font-size="38">One core, the gate and everyone around it</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>

  <text x="56" y="166" class="sans" font-size="12" fill="#685762">01 — The gate and the core</text>
  <rect x="56" y="184" width="268" height="96" class="hot"/>
  <text x="76" y="218" class="serif" font-size="24">Gate devices</text>
  <text x="76" y="242" class="mono" font-size="14">Facial terminals</text>
  <text x="76" y="262" class="mono" font-size="14">QR scanners</text>
  <rect x="424" y="184" width="268" height="96" class="hot"/>
  <text x="444" y="218" class="serif" font-size="24">Spring Boot API</text>
  <text x="444" y="242" class="mono" font-size="14">Core platform</text>
  <text x="444" y="262" class="mono" font-size="14">Spring Security · OAuth2</text>
  <rect x="792" y="184" width="268" height="96" class="hot"/>
  <text x="812" y="218" class="serif" font-size="24">MySQL</text>
  <text x="812" y="242" class="mono" font-size="14">Residents and visit log</text>
  <text x="812" y="262" class="mono" font-size="14">Face state and slots</text>
  <rect x="1160" y="184" width="268" height="96" class="box"/>
  <text x="1180" y="218" class="serif" font-size="24">S3</text>
  <text x="1180" y="242" class="mono" font-size="14">Resident photos</text>
  <text x="1180" y="262" class="mono" font-size="14">Served to the terminals</text>
  <path d="M324 232 H 420" class="flow" marker-end="url(#acc)"/>
  <text x="332" y="222" class="mono" font-size="13">HTTPS</text>
  <text x="332" y="254" class="mono" font-size="13">HMAC</text>
  <path d="M692 232 H 788" class="flow" marker-end="url(#acc)"/>
  <text x="700" y="222" class="mono" font-size="13">SQL</text>
  <path d="M624 280 V 304 H 1294 V 284" class="link" stroke-dasharray="6 6" marker-end="url(#ink)"/>
  <text x="56" y="326" class="sans" font-size="12" fill="#685762">02 — The people</text>
  <rect x="56" y="344" width="268" height="96" class="box"/>
  <text x="76" y="378" class="serif" font-size="24">Flutter apps</text>
  <text x="76" y="402" class="mono" font-size="14">Residents and guards</text>
  <text x="76" y="422" class="mono" font-size="14">iOS · Android</text>
  <rect x="424" y="344" width="268" height="96" class="box"/>
  <text x="444" y="378" class="serif" font-size="24">Vue admin panel</text>
  <text x="444" y="402" class="mono" font-size="14">Faces, residents, reports</text>
  <text x="444" y="422" class="mono" font-size="14">One panel per community</text>
  <rect x="792" y="344" width="268" height="96" class="box"/>
  <text x="812" y="378" class="serif" font-size="24">Guards web app</text>
  <text x="812" y="402" class="mono" font-size="14">Angular</text>
  <text x="812" y="422" class="mono" font-size="14">Runs in the browser</text>
  <path d="M190 344 V 322 H 454 V 284" class="link" marker-end="url(#ink)"/>
  <path d="M484 344 V 284" class="link" marker-end="url(#ink)"/>
  <path d="M926 344 V 322 H 554 V 284" class="link" marker-end="url(#ink)"/>
  <text x="1160" y="378" class="mono" font-size="14">Everyone signs in with</text>
  <text x="1160" y="400" class="mono" font-size="14">the platform’s own</text>
  <text x="1160" y="422" class="mono" font-size="14">OAuth2 tokens</text>
  <text x="56" y="486" class="sans" font-size="12" fill="#685762">03 — Chatbot and QR codes</text>
  <rect x="56" y="504" width="268" height="96" class="box"/>
  <text x="76" y="538" class="serif" font-size="24">WhatsApp chatbot</text>
  <text x="76" y="562" class="mono" font-size="14">Python · FastAPI</text>
  <text x="76" y="582" class="mono" font-size="14">Botmaker · MySQL</text>
  <rect x="424" y="504" width="268" height="96" class="box"/>
  <text x="444" y="538" class="serif" font-size="24">MQTT service</text>
  <text x="444" y="562" class="mono" font-size="14">FastAPI on Lambda</text>
  <text x="444" y="582" class="mono" font-size="14">Visitor check-in, QR</text>
  <rect x="792" y="504" width="268" height="96" class="box"/>
  <text x="812" y="538" class="serif" font-size="24">AWS IoT Core</text>
  <text x="812" y="562" class="mono" font-size="14">MQTT broker</text>
  <text x="812" y="582" class="mono" font-size="14">Rules route the ACK</text>
  <rect x="1160" y="504" width="268" height="96" class="box"/>
  <text x="1180" y="538" class="serif" font-size="24">QR scanners</text>
  <text x="1180" y="562" class="mono" font-size="14">Get temporary codes</text>
  <text x="1180" y="582" class="mono" font-size="14">ACK back via IoT rule</text>
  <path d="M324 552 H 420" class="link" marker-end="url(#ink)"/>
  <text x="332" y="542" class="mono" font-size="13">HTTPS</text>
  <path d="M692 552 H 788" class="link" marker-end="url(#ink)"/>
  <text x="700" y="542" class="mono" font-size="13">MQTT</text>
  <path d="M1060 552 H 1156" class="link" marker-end="url(#ink)"/>
  <text x="1068" y="542" class="mono" font-size="13">MQTT</text>
  <line x1="1472" y1="196" x2="1472" y2="600" class="rule"/>
  <text x="1490" y="236" class="serif" font-size="36">~7,000</text>
  <text x="1490" y="262" class="sans" font-size="11" fill="#685762">accesses a month</text>
  <text x="1490" y="280" class="sans" font-size="11" fill="#685762">via WhatsApp</text>
  <text x="1490" y="356" class="serif" font-size="36">1–3 min</text>
  <text x="1490" y="382" class="sans" font-size="11" fill="#685762">per visitor,</text>
  <text x="1490" y="400" class="sans" font-size="11" fill="#685762">down from 4–10</text>
  <text x="1490" y="476" class="serif" font-size="36">~5,000</text>
  <text x="1490" y="502" class="sans" font-size="11" fill="#685762">active users</text>
  <!-- Footer band -->
  <line x1="56" y1="648" x2="1624" y2="648" class="rule"/>
  <text x="56" y="682" class="sans" font-size="12" fill="#07393C">Infrastructure</text>
  <text x="330" y="682" class="mono" font-size="14">AWS CDK: Lambda · API Gateway · IoT Core · Secrets Manager · API on Elastic Beanstalk · web apps on S3 + CloudFront</text>
</svg>
