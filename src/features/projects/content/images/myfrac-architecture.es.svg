  <path d="M484 344 V 284" class="link" marker-end="url(#ink)"/>
  <path d="M926 344 V 322 H 554 V 284" class="link" marker-end="url(#ink)"/>
  <text x="1160" y="378" class="mono" font-size="14">Todos entran con el login</text>
