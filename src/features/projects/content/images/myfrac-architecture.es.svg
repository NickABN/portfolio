  <text x="1160" y="422" class="mono" font-size="14">con tokens OAuth2</text>
  <text x="56" y="486" class="sans" font-size="12" fill="#685762">03 — Chatbot y códigos QR</text>
  <rect x="56" y="504" width="268" height="96" class="box"/>
  <text x="76" y="538" class="serif" font-size="24">Chatbot de WhatsApp</text>
  <text x="76" y="562" class="mono" font-size="14">Python · FastAPI</text>
  <text x="76" y="582" class="mono" font-size="14">Botmaker · MySQL</text>
  <rect x="424" y="504" width="268" height="96" class="box"/>
  <text x="444" y="538" class="serif" font-size="24">Servicio MQTT</text>
  <text x="444" y="562" class="mono" font-size="14">FastAPI en Lambda</text>
  <text x="444" y="582" class="mono" font-size="14">Check-in de visitas, QR</text>
