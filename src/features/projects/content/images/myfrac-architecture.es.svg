  <text x="56" y="66" class="sans" font-size="14" fill="#9E5536">MYFRAC · Arquitectura</text>
  <text x="56" y="108" class="serif" font-size="38">Un núcleo, la caseta y quienes la usan</text>
  <line x1="56" y1="132" x2="1624" y2="132" class="rule"/>

